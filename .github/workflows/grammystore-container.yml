name: Publish grammystore container image

on:
  push:
    branches:
      - main
      - grammy
    paths:
      - 'cmd/bots/grammystore/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-grammystore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish grammystore
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/grammystore
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: cmd/bots/grammystore
          file: cmd/bots/grammystore/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=grammystore
          cache-to: type=gha,mode=max,scope=grammystore
